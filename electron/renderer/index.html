<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Islands</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div id="profile-badge" class="profile-badge"></div>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <span class="activity-status" id="activity-status" role="status" aria-live="polite"><span class="activity-status-dot" aria-hidden="true"></span><span class="activity-status-text"></span></span>
      <div class="local-note" title="Stored on this Mac"><span class="local-dot"></span><span class="local-note-text">Stored on this Mac</span></div>
    </header>
    <main id="content" class="content" aria-live="polite"></main>
  </div>
  <div id="dialog-root"></div>
</body>
</html>
