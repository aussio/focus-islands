<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A little focus pause · Cozy Focus Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="nudge-page">
  <main class="nudge-card">
    <div class="pet" aria-hidden="true"><div class="pet-ear left"></div><div class="pet-ear right"></div><div class="pet-face"><span></span><span></span></div></div>
    <p class="eyebrow">Cozy Focus Pet</p>
    <h1>A little focus pause</h1>
    <p>Your focus timer is running. Take a breath before visiting <strong id="site">this site</strong>.</p>
    <div class="actions">
      <button id="continue" type="button">Continue once</button>
      <button id="stay" class="secondary" type="button">Stay focused</button>
    </div>
    <p class="hint" id="message" role="status">Your choice is always yours.</p>
  </main>
  <script src="nudge.js"></script>
</body>
</html>
