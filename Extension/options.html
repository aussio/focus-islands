<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose sites · Cozy Focus Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="settings-card">
    <p class="eyebrow">Cozy Focus Pet</p>
    <h1>Choose your pause sites</h1>
    <p>During focus, these sites open with a gentle reminder. Enter one domain per line. Changes stay in Chrome on this device.</p>
    <label for="domains">Domains</label>
    <textarea id="domains" rows="8" spellcheck="false" placeholder="youtube.com&#10;feedly.com&#10;reddit.com"></textarea>
    <button id="save" type="button">Save sites</button>
    <p class="hint" id="message" role="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
